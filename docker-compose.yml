services:
  bp-agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      STATE_PATH: /app/data/learner.db
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    volumes:
      - bp_agent_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bp_agent_data:
